  <style>
    :root {
      --slate-teal-deep: #0E2D36;
      --slate-teal-primary: #1B4D5C;
      --slate-teal-surface: #F0F5F6;
      --parchment-base: #FBF9F4;
      --parchment-card: #FFFFFF;

      --forest-stone: #253338;
      --critical-crimson: #A82A2A;
      --border-subtle: #DCE5E7;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--parchment-base);

      overflow-x: hidden;
    }

    .font-serif-collegiate {
      font-family: 'Playfair Display', Georgia, serif;

    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(220, 229, 231, 0.85);
      box-shadow: 0 4px 20px -2px rgba(27, 77, 92, 0.06);
    }

    .glass-panel-elevated {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(220, 229, 231, 0.9);
      box-shadow: 0 12px 32px -4px rgba(14, 45, 54, 0.12);
    }

    .tactile-card {
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .tactile-card:hover {
      transform: translateY(-3px) scale(1.008);
      box-shadow: 0 16px 36px -6px rgba(27, 77, 92, 0.14);
    }

    .heatmap-cell {
      transition: transform 0.15s ease;
      cursor: pointer;
    }
    .heatmap-cell:hover {
      transform: scale(1.4);
      z-index: 20;
